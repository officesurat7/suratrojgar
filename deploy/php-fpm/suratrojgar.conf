; /etc/php/8.3/fpm/pool.d/suratrojgar.conf
; Sized for an 8 GB VPS. Each worker uses roughly 40-60 MB; measure with `ps` under load and adjust pm.max_children.
[suratrojgar]
user = suratrojgar
group = www-data
listen = /run/php/php8.3-fpm-suratrojgar.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 60
pm.start_servers = 12
pm.min_spare_servers = 8
pm.max_spare_servers = 20
pm.max_requests = 1000
request_terminate_timeout = 65s

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 9M
php_admin_value[expose_php] = Off
php_admin_value[disable_functions] = passthru,shell_exec,system,popen,pcntl_exec
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php/suratrojgar-fpm.log
slowlog = /var/log/php/suratrojgar-slow.log
request_slowlog_timeout = 5s
; Note: proc_open stays enabled because the backup command (mysqldump) and Laravel need it.
