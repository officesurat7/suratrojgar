# Add to /etc/redis/redis.conf
bind 127.0.0.1 ::1
protected-mode yes
requirepass CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD   # put the same value in backend/.env REDIS_PASSWORD
maxmemory 768mb
maxmemory-policy volatile-lru     # evict cache keys with a TTL first; queues have no TTL and are kept
appendonly yes                    # queued emails survive a restart
