# /etc/nginx/sites-available/suratrojgar.conf
# Two server blocks: the website (Next.js on :3000) and the API (Laravel via PHP-FPM).
# Replace suratrojgar.in with your domain. TLS certificates come from certbot (see docs/INSTALL.md).

# Basic abuse protection. Laravel adds finer per-route limits on top of these.
limit_req_zone $binary_remote_addr zone=sr_api:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sr_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sr_conn:20m;

upstream sr_next { server 127.0.0.1:3000; keepalive 64; }

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name suratrojgar.in www.suratrojgar.in api.suratrojgar.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- www -> apex ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.suratrojgar.in;
    ssl_certificate     /etc/letsencrypt/live/suratrojgar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suratrojgar.in/privkey.pem;
    return 301 https://suratrojgar.in$request_uri;
}

# ---------- Website (Next.js) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name suratrojgar.in;

    ssl_certificate     /etc/letsencrypt/live/suratrojgar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suratrojgar.in/privkey.pem;
    include /etc/nginx/snippets/suratrojgar-ssl.conf;

    access_log /var/log/nginx/suratrojgar.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/suratrojgar.error.log warn;

    client_max_body_size 8m;            # resume uploads go through the Next.js proxy
    limit_conn sr_conn 50;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed build assets never change: cache for a year
    location /_next/static/ {
        proxy_pass http://sr_next;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api/auth/ {
        limit_req zone=sr_auth burst=10 nodelay;
        proxy_pass http://sr_next;
        include /etc/nginx/snippets/suratrojgar-proxy.conf;
    }

    location / {
        limit_req zone=sr_api burst=60 nodelay;
        proxy_pass http://sr_next;
        include /etc/nginx/snippets/suratrojgar-proxy.conf;
    }
}

# ---------- API (Laravel) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.suratrojgar.in;

    ssl_certificate     /etc/letsencrypt/live/suratrojgar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suratrojgar.in/privkey.pem;
    include /etc/nginx/snippets/suratrojgar-ssl.conf;

    root /var/www/suratrojgar/current/backend/public;
    index index.php;

    access_log /var/log/nginx/suratrojgar-api.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/suratrojgar-api.error.log warn;

    client_max_body_size 8m;
    limit_conn sr_conn 50;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Public images (company logos, slider images). Resumes are NOT here: they live on a private disk.
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(php|phtml|html?|svg)$ { deny all; }
        try_files $uri =404;
    }

    location / {
        limit_req zone=sr_api burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm-suratrojgar.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # Never serve dotfiles (.env, .git) or any other PHP file
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.php$ { return 404; }
}
