; /etc/supervisor/conf.d/suratrojgar.conf
[program:suratrojgar-web]
command=/usr/bin/node /var/www/suratrojgar/current/frontend/node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3000
directory=/var/www/suratrojgar/current/frontend
user=suratrojgar
environment=NODE_ENV="production"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/suratrojgar/web.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true

; Emails, OTPs and notifications. "high" holds OTP emails so they are never stuck behind bulk mail.
[program:suratrojgar-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/suratrojgar/current/backend/artisan queue:work redis --queue=high,notifications,default --sleep=1 --tries=3 --backoff=30 --max-time=3600 --memory=256
user=suratrojgar
numprocs=4
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/var/log/suratrojgar/queue.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true
